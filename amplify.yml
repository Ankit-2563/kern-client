version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install Bun and add it to the path
        - curl -fsSL https://bun.sh/install | bash
        - export PATH="$HOME/.bun/bin:$PATH"
        # Print version to verify installation
        - bun --version
        # Cleanly install dependencies using the lockfile
        - bun install --frozen-lockfile
    build:
      commands:
        - export PATH="$HOME/.bun/bin:$PATH"
        # Build the Next.js application
        - bun run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
